name: Bug report
description: Something in Since doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Press …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Since version
      description: Since → About Since.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove anything private (paths, remote URLs, commit messages) before posting.
